
name: Credential Security Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-test:
    runs-on: ubuntu-latest

    env:
      LAB_CANARY: ${{ secrets.LAB_CANARY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Simulate credential exposure
        shell: bash
        run: |
          if [ -n "${LAB_CANARY:-}" ]; then
            echo "CANARY_PRESENT=true"
          else
            echo "CANARY_PRESENT=false"
            exit 1
          fi

          echo "Credential value intentionally hidden."

